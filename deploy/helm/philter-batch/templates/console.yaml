{{- if .Values.console.enabled }}
{{- $fullname := include "philter-batch.fullname" . }}
{{- if .Values.console.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "philter-batch.consoleServiceAccountName" . }}
  labels:
    {{- include "philter-batch.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with .Values.console.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# The console may start and read the namespace's Argo workflows, and nothing else in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-console
  labels:
    {{- include "philter-batch.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-console
  labels:
    {{- include "philter-batch.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-console
subjects:
  - kind: ServiceAccount
    name: {{ include "philter-batch.consoleServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# The console: the philter-batch image, idle, for kubectl exec. A StatefulSet for its stable name
# (<full name>-console-0). It has no volume and keeps no state: runs live in the bucket.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-console
  labels:
    {{- include "philter-batch.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  serviceName: {{ $fullname }}-console
  replicas: 1
  selector:
    matchLabels:
      {{- include "philter-batch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "philter-batch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: {{ include "philter-batch.consoleServiceAccountName" . }}
      # sleep ignores SIGTERM, and there is nothing to save.
      terminationGracePeriodSeconds: 2
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "philter-batch.placement" .Values.console | trim }}{{ nindent 6 . }}{{ end }}
      containers:
        - name: console
          image: {{ include "philter-batch.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sleep", "infinity"]
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.console.javaOptions | quote }}
            {{- include "philter-batch.env" . | nindent 12 }}
            - name: PHILTER_BATCH_WORKFLOW_TEMPLATE
              value: {{ $fullname }}
          {{- if .Values.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.credentialsSecret }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.console.cpu | quote }}
              memory: {{ .Values.console.memory | quote }}
            limits:
              cpu: {{ .Values.console.cpu | quote }}
              memory: {{ .Values.console.memory | quote }}
          securityContext:
            {{- include "philter-batch.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}
        {{- include "philter-batch.tmpVolume" .Values.console.tmpSizeLimit | nindent 8 }}
{{- end }}
