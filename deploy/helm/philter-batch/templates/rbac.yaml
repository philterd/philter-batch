# The least Argo's executor needs: its wait container records each step's result as a WorkflowTaskResult.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "philter-batch.fullname" . }}-executor
  labels:
    {{- include "philter-batch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "philter-batch.fullname" . }}-executor
  labels:
    {{- include "philter-batch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "philter-batch.fullname" . }}-executor
subjects:
  - kind: ServiceAccount
    name: {{ include "philter-batch.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
